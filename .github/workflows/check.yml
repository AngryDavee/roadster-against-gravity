name: Scene checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run recipe:check
      - run: npm run race:check
      - run: npm run race:simulation
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-evidence
          path: evidence/checks/
  racing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run race:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: racing-browser-evidence
          path: evidence/racing/playtest/
